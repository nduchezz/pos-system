services:
  - type: web
    name: pos-backend
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install --production=false && npm run build
    startCommand: npm run start
    preDeployCommand: npm run prisma:migrate
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"
      - key: PORT
        value: 10000

databases:
  - name: pos-db
    plan: free
    databaseName: pos_db
    user: pos_user
    region: frankfurt
